<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Embla Carousel Test</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="embla">
    <div
      class="embla__viewport"
      id="embla-viewport"
      role="region"
      aria-roledescription="carousel"
      aria-label="Featured slides"
    >
      <div class="embla__container">
        <div class="embla__slide" role="group" aria-roledescription="slide" aria-label="Slide 1 of 9">
          <img class="embla__slide__img" src="https://placehold.co/400x300" alt="" />
          <h2 class="embla__slide__heading">Slide 1</h2>
        </div>
        <div class="embla__slide" role="group" aria-roledescription="slide" aria-label="Slide 2 of 9">
          <img class="embla__slide__img" src="https://placehold.co/400x300" alt="" />
          <h2 class="embla__slide__heading">Slide 2</h2>
        </div>
        <div class="embla__slide" role="group" aria-roledescription="slide" aria-label="Slide 3 of 9">
          <img class="embla__slide__img" src="https://placehold.co/400x300" alt="" />
          <h2 class="embla__slide__heading">Slide 3</h2>
        </div>
        <div class="embla__slide" role="group" aria-roledescription="slide" aria-label="Slide 4 of 9">
          <img class="embla__slide__img" src="https://placehold.co/400x300" alt="" />
          <h2 class="embla__slide__heading">Slide 4</h2>
        </div>
        <div class="embla__slide" role="group" aria-roledescription="slide" aria-label="Slide 5 of 9">
          <img class="embla__slide__img" src="https://placehold.co/400x300" alt="" />
          <h2 class="embla__slide__heading">Slide 5</h2>
        </div>
        <div class="embla__slide" role="group" aria-roledescription="slide" aria-label="Slide 6 of 9">
          <img class="embla__slide__img" src="https://placehold.co/400x300" alt="" />
          <h2 class="embla__slide__heading">Slide 6</h2>
        </div>
        <div class="embla__slide" role="group" aria-roledescription="slide" aria-label="Slide 7 of 9">
          <img class="embla__slide__img" src="https://placehold.co/400x300" alt="" />
          <h2 class="embla__slide__heading">Slide 7</h2>
        </div>
        <div class="embla__slide" role="group" aria-roledescription="slide" aria-label="Slide 8 of 9">
          <img class="embla__slide__img" src="https://placehold.co/400x300" alt="" />
          <h2 class="embla__slide__heading">Slide 8</h2>
        </div>
        <div class="embla__slide" role="group" aria-roledescription="slide" aria-label="Slide 9 of 9">
          <img class="embla__slide__img" src="https://placehold.co/400x300" alt="" />
          <h2 class="embla__slide__heading">Slide 9</h2>
        </div>
      </div>
    </div>
    <button class="embla__prev" type="button" aria-controls="embla-viewport">Prev</button>
    <button class="embla__next" type="button" aria-controls="embla-viewport">Next</button>
    <div class="embla__live-region" aria-live="polite" aria-atomic="true"></div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
